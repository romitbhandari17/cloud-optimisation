[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudineer-cost-assessment-engine"
version = "0.1.0"
description = "Cloudineer Cost Assessment Engine — reusable AWS FinOps agent framework"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "moto>=5.0"]

[project.scripts]
cloudineer = "cloudineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
