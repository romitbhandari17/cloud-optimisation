<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloudineer FinOps Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1e2639;
    --border: #2a3450;
    --text: #e8ecf5;
    --muted: #93a1c2;
    --accent: #5b8cff;
    --green: #2ecc8f;
    --yellow: #f4c45c;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { padding: 24px 32px; max-width: 1300px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .section h2 { margin: 0 0 14px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .risk { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .risk-high { background: rgba(255,107,107,.15); color: var(--red); }
  .risk-medium { background: rgba(244,196,92,.15); color: var(--yellow); }
  .risk-low { background: rgba(46,204,143,.15); color: var(--green); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .reports-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
  .report-row {
    display: flex; justify-content: space-between; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .report-row:hover { background: var(--panel-2); }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Cloudineer FinOps Dashboard</h1>
    <div class="sub">Discovery · Cost Analysis · EC2 Optimisation</div>
  </div>
  <div class="controls">
    <select id="customerSelect"><option>Loading customers…</option></select>
    <button id="runBtn">Run Assessment</button>
    <span id="runStatus" class="status"></span>
  </div>
</header>

<main>
  <div class="section">
    <h2>Reports</h2>
    <div id="reportsList" class="reports-list"><div class="empty">Select a customer to see reports.</div></div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="grid" id="summaryCards"></div>

    <div class="charts">
      <div class="section">
        <h2>Potential Savings by Agent</h2>
        <canvas id="savingsChart" height="220"></canvas>
      </div>
      <div class="section">
        <h2>Cost Breakdown</h2>
        <canvas id="costChart" height="220"></canvas>
      </div>
    </div>

    <div class="section">
      <h2>Priority Recommendations</h2>
      <div id="recommendationsTable"></div>
    </div>

    <div class="section">
      <h2>Architecture Risks</h2>
      <div id="risksTable"></div>
    </div>

    <div class="section">
      <h2>AI Opportunities</h2>
      <div id="aiList"></div>
    </div>
  </div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
let charts = {};

async function api(path, opts) {
  const res = await fetch(`${API_BASE_URL}${path}`, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `${res.status} ${res.statusText}`);
  }
  return res.json();
}

function riskBadge(risk) {
  return `<span class="risk risk-${risk}">${risk.toUpperCase()}</span>`;
}

function money(n) {
  return `$${Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
}

async function loadCustomers() {
  const select = $("#customerSelect");
  try {
    const { customers } = await api("/customers");
    select.innerHTML = customers
      .map((c) => `<option value="${c.customer_id}">${c.customer_id} (${c.account_id})</option>`)
      .join("");
    if (customers.length) loadReports(select.value);
  } catch (e) {
    select.innerHTML = `<option>Error loading customers</option>`;
    console.error(e);
  }
}

async function loadReports(customerId) {
  const list = $("#reportsList");
  list.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const { reports } = await api(`/reports?customer_id=${encodeURIComponent(customerId)}`);
    if (!reports.length) {
      list.innerHTML = `<div class="empty">No reports yet. Click "Run Assessment" to generate one.</div>`;
      return;
    }
    list.innerHTML = reports
      .map(
        (r) => `<div class="report-row" data-key="${r.key}">
          <span>${new Date(r.last_modified).toLocaleString()}</span>
          <span>${(r.size_bytes / 1024).toFixed(1)} KB</span>
        </div>`
      )
      .join("");
    list.querySelectorAll(".report-row").forEach((row) => {
      row.addEventListener("click", () => loadDashboard(row.dataset.key));
    });
    loadDashboard(reports[0].key);
  } catch (e) {
    list.innerHTML = `<div class="empty">Error loading reports: ${e.message}</div>`;
  }
}

async function loadDashboard(key) {
  try {
    const dashboard = await api(`/reports/${key}`);
    renderDashboard(dashboard);
  } catch (e) {
    console.error(e);
  }
}

function renderDashboard(d) {
  $("#dashboard").style.display = "block";

  $("#summaryCards").innerHTML = `
    <div class="card"><div class="label">Total Monthly Savings</div><div class="value">${money(d.potential_savings.total_monthly_usd)}</div></div>
    <div class="card"><div class="label">Findings</div><div class="value">${d.priority_recommendations.length}</div></div>
    <div class="card"><div class="label">Architecture Risks</div><div class="value">${d.architecture_risks.length}</div></div>
    <div class="card"><div class="label">AI Opportunities</div><div class="value">${d.ai_opportunities.length}</div></div>
  `;

  const byAgent = d.potential_savings.by_agent || {};
  renderChart("savingsChart", "bar", Object.keys(byAgent), Object.values(byAgent), "#5b8cff", "Monthly Savings (USD)");

  const cost = d.cost_breakdown || {};
  renderChart("costChart", "doughnut", Object.keys(cost), Object.values(cost));

  $("#recommendationsTable").innerHTML = table(
    d.priority_recommendations,
    ["agent", "resource_id", "finding", "recommendation", "estimated_monthly_savings", "risk"]
  );
  $("#risksTable").innerHTML = table(
    d.architecture_risks,
    ["agent", "resource_id", "finding", "recommendation", "risk"]
  );
  $("#aiList").innerHTML = d.ai_opportunities.length
    ? d.ai_opportunities.map((o) => `<p><strong>${o.resource_id}</strong> (${o.agent}): ${o.insight}</p>`).join("")
    : `<div class="empty">No AI opportunities reported.</div>`;
}

function table(rows, cols) {
  if (!rows.length) return `<div class="empty">Nothing to show.</div>`;
  const head = cols.map((c) => `<th>${c.replace(/_/g, " ")}</th>`).join("");
  const body = rows
    .map(
      (r) =>
        `<tr>${cols
          .map((c) =>
            c === "risk"
              ? `<td>${riskBadge(r[c])}</td>`
              : c === "estimated_monthly_savings"
              ? `<td>${money(r[c])}</td>`
              : `<td>${r[c] ?? ""}</td>`
          )
          .join("")}</tr>`
    )
    .join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderChart(canvasId, type, labels, data, color, datasetLabel) {
  if (charts[canvasId]) charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId).getContext("2d");
  charts[canvasId] = new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [
        {
          label: datasetLabel || "",
          data,
          backgroundColor: color || ["#5b8cff", "#2ecc8f", "#f4c45c", "#ff6b6b", "#a78bfa", "#38bdf8"],
          borderWidth: 0,
        },
      ],
    },
    options: {
      // Bar charts here only ever have one dataset and the x-axis already
      // labels each bar, so a legend would just show a redundant "undefined"
      // (Chart.js falls back to the dataset label, which bars don't need).
      plugins: { legend: { display: type !== "bar", labels: { color: "#e8ecf5" } } },
      scales: type === "bar" ? { x: { ticks: { color: "#93a1c2" } }, y: { ticks: { color: "#93a1c2" } } } : {},
    },
  });
}

$("#customerSelect").addEventListener("change", (e) => loadReports(e.target.value));

$("#runBtn").addEventListener("click", async () => {
  const customerId = $("#customerSelect").value;
  const status = $("#runStatus");
  const btn = $("#runBtn");
  btn.disabled = true;
  status.className = "status";
  status.textContent = "Starting…";
  try {
    const result = await api("/assessments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: customerId }),
    });
    status.className = "status ok";
    status.textContent = `Started: ${result.execution_arn.split(":").pop()}`;
  } catch (e) {
    status.className = "status err";
    status.textContent = `Error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
});

if (!API_BASE_URL) {
  document.body.insertAdjacentHTML(
    "afterbegin",
    `<div style="background:#ff6b6b;color:#1a1a1a;padding:10px 32px;font-weight:600;">
      Set API_BASE_URL in ui/config.js (terraform output: api_base_url) before using this dashboard.
    </div>`
  );
} else {
  loadCustomers();
}
</script>
</body>
</html>
